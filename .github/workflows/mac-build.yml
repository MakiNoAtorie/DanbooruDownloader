name: Windows build for Mac wrapping

on:
  workflow_dispatch:
  push:
    branches: [ mac-build-ci ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore DanbooruDownloader3.sln

      - name: Build DanbooruDownloader3
        run: msbuild DanbooruDownloader3\DanbooruDownloader3.csproj /p:Configuration=Release /p:Platform=AnyCPU

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: DanbooruDownloader3-win-build
          path: |
            DanbooruDownloader3/bin/Release/**
